events {}

http {
    upstream fastapi_app {
#	server fast-api:8000;
	server fast-api_v2:8000;
}

    
    server {
        listen 80;
        server_name basharr.indevs.in;

#        ssl_certificate /etc/letsencrypt/live/admissionhub.duckdns.org/fullchain.pem;
#        ssl_certificate_key /etc/letsencrypt/live/admissionhub.duckdns.org/privkey.pem;

        location /api/ {
            proxy_pass http://fastapi_app/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://app-frontend1:80;
        }
	location /server {
	    default_type text/plain;
	    return 200 "Healthcheck passed\nEC2 Server 1:  ip-192-168-200-214\n";
	}
    }
}
